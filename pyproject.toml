[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-backend"
version = "0.1.0"
description = "Contract-first backend for Creator"
requires-python = ">=3.12,<3.14"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "crewai>=1.15,<2",
  "aiohttp>=3.14.4,<4",
  "certifi>=2026.10.19,<2027",
  "filelock>=4.2.1,<5",
  "fastapi>=0.115,<1",
  "google-genai>=1.54,<2",
  "multidict>=6.9.1,<7",
  "langchain>=1,<2",
  "langchain-chroma>=1,<2",
  "langchain-google-genai>=4,<5",
  "oauthlib>=4,<5",
  "opentelemetry-api>=1.45.1,<2",
  "Pillow>=13,<14",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "redis>=5,<6",
  "rq>=2,<3",
  "PyJWT[crypto]>=2.15,<3",
  "urllib3>=2.8,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "playwright>=1.50,<2",
  "ruff>=0.9,<1",
  "pip-audit>=2.7,<3",
]

[project.scripts]
creator-worker = "creator.workers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["creator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: end-to-end API flows",
  "integration: database-backed integration tests",
]
addopts = "--no-header --cov=creator --cov-report=term-missing --cov-fail-under=73 -p no:cacheprovider"
tmp_path_retention_policy = "none"

[tool.coverage.run]
# Routers are HTTP adapters exercised by the e2e suite; `make check` runs unit
# tests only, so they are excluded exactly as `creator.api`/`creator.main` were
# before the modular extraction.
omit = [
  "*/creator/*/router.py",
  "*/api/router.py",
  "*/api/system.py",
  "*/api/openapi.py",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["google", "google.*", "argon2", "argon2.*"]
ignore_missing_imports = true
