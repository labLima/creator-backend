name: creator

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    # These defaults are for local HTTP. Production must override APP_ENV,
    # AUTH_COOKIE_SECURE and AUTH_JWT_SECRET through the deployment secret/env.
    APP_ENV: "${APP_ENV:-local}"
    DATABASE_URL: "${DATABASE_URL:-sqlite+pysqlite:////data/creator.db}"
    REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    LOCAL_STORAGE_ROOT: "${LOCAL_STORAGE_ROOT:-/app/.local/storage}"
    AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}"
    AUTH_ACCESS_TOKEN_TTL_SECONDS: "${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}"
    AUTH_REFRESH_TOKEN_TTL_DAYS: "${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}"
    AUTH_COOKIE_SESSIONS_ENABLED: "${AUTH_COOKIE_SESSIONS_ENABLED:-true}"
    AUTH_LEGACY_BEARER_ENABLED: "${AUTH_LEGACY_BEARER_ENABLED:-true}"
    AUTH_TOKEN_BODY_ENABLED: "${AUTH_TOKEN_BODY_ENABLED:-true}"
    AUTH_COOKIE_ACCESS_NAME: "${AUTH_COOKIE_ACCESS_NAME:-creator_access}"
    AUTH_COOKIE_REFRESH_NAME: "${AUTH_COOKIE_REFRESH_NAME:-creator_refresh}"
    AUTH_COOKIE_CSRF_NAME: "${AUTH_COOKIE_CSRF_NAME:-creator_csrf}"
    AUTH_COOKIE_ACCESS_PATH: "${AUTH_COOKIE_ACCESS_PATH:-/api/v1}"
    AUTH_COOKIE_REFRESH_PATH: "${AUTH_COOKIE_REFRESH_PATH:-/api/v1/auth}"
    AUTH_COOKIE_CSRF_PATH: "${AUTH_COOKIE_CSRF_PATH:-/}"
    AUTH_COOKIE_SAME_SITE: "${AUTH_COOKIE_SAME_SITE:-lax}"
    AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
    AUTH_CSRF_HEADER_NAME: "${AUTH_CSRF_HEADER_NAME:-X-CSRF-Token}"
    AUTH_CSRF_TTL_SECONDS: "${AUTH_CSRF_TTL_SECONDS:-900}"
    AUTH_SESSION_ABSOLUTE_TTL_DAYS: "${AUTH_SESSION_ABSOLUTE_TTL_DAYS:-90}"
    AUTH_CORS_ORIGINS: "${AUTH_CORS_ORIGINS:-[]}"
  volumes:
    - sqlite_data:/data
    - storage_data:/app/.local/storage

services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command:
      ["uvicorn", "creator.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["creator-worker", "all"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite_data:
  storage_data:
  redis_data:
  prometheus_data:
