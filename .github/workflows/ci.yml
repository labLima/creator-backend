name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: make check

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: make dependency-audit
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan secrets
        run: ./gitleaks detect --source . --no-banner --redact --config .gitleaks.toml

  contract:
    name: OpenAPI parity and Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q --no-cov tests/test_openapi_contract.py tests/test_app_structure.py
      - run: docker compose config
        env:
          AUTH_JWT_SECRET: ci-test-secret-with-32-bytes
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: creator-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end API tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: make e2e

  containers:
    name: Container orchestration smoke test
    runs-on: ubuntu-latest
    needs: quality
    env:
      AUTH_JWT_SECRET: ci-test-secret-with-32-bytes
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: docker compose ps
      - run: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=10)"
      - run: docker compose run --rm --no-deps worker creator-worker --help
      - if: always()
        run: docker compose down --volumes --remove-orphans

  deploy:
    name: Deploy to Cloud Run
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [quality, contract, security, e2e, containers]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - run: echo "Cloud Run deployment is intentionally protected; configure Workload Identity and project secrets per ADR-009."
