openapi: 3.1.0
info:
  title: Creator API
  version: 0.1.0
  description: >-
    Contract-first API for Creator, including core Workspace-scoped CRUD resources.
    Every HTTP response includes the X-Request-ID response header; JSON envelopes
    repeat the same UUID in meta.request_id.
x-rate-limit:
  applies_to: /api/v1/**
  default_limit: 5
  window_seconds: 1
  identity:
    authenticated: Principal.subject
    public_auth: client_ip
  response:
    $ref: '#/components/responses/RateLimitExceeded'
servers:
- url: http://localhost:8000
tags:
- name: System
  description: Health, liveness and operational endpoints.
- name: Auth
  description: Authentication and signup endpoints.
- name: Users
  description: User profile and administration endpoints.
- name: Settings
  description: Authenticated Principal settings endpoints.
- name: Workspaces
  description: Workspace lifecycle endpoints.
- name: Brands
  description: Brand and Brand Settings endpoints.
- name: Projects
  description: Project endpoints.
- name: Contents
  description: Content CRUD and content workflow endpoints.
- name: Generations
  description: Generation lifecycle endpoints.
- name: Assets
  description: Asset metadata endpoints.
- name: Images
  description: Image generation and retrieval endpoints.
- name: Campaigns
  description: Campaigns replacing the legacy Project resource.
- name: Personas
  description: Workspace-scoped audience personas.
- name: Planning
  description: Campaign planning records and Persona snapshots.
- name: Post Structures
  description: Contract-first post content structures.
- name: Notifications
  description: Principal notification settings and devices.
- name: Billing
  description: Billing plan administration endpoints.
- name: Brand Assets
  description: Brand-owned assets from the database schema.
paths:
  /health:
    get:
      operationId: getHealth
      tags:
      - System
      responses:
        '200':
          description: Application health status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/live:
    get:
      operationId: liveHealth
      tags:
      - System
      responses:
        '200':
          description: Process is alive.
  /metrics:
    get:
      operationId: getMetrics
      tags:
      - System
      responses:
        '200':
          description: Prometheus metrics with bounded labels.
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/login:
    post:
      operationId: loginWithPassword
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Local auth session for a Creator Principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          $ref: '#/components/responses/LoginRejected'
        '429':
          $ref: '#/components/responses/AuthRateLimited'
        '500':
          $ref: '#/components/responses/AuthMisconfigured'
  /api/v1/auth/signup:
    post:
      operationId: signupWithPassword
      tags:
      - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSignupRequest'
      responses:
        '201':
          description: Local auth signup result for a Creator Principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSignupResponse'
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
        '422':
          $ref: '#/components/responses/WeakPassword'
        '429':
          $ref: '#/components/responses/AuthRateLimited'
        '500':
          $ref: '#/components/responses/SignupFailed'
  /api/v1/auth/csrf:
    get:
      operationId: csrfToken
      tags:
      - Auth
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: CSRF token for the current Auth Session.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/users/me:
    get:
      operationId: getMyProfile
      tags:
      - Users
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Current authenticated User.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/settings:
    get:
      operationId: getMySettings
      tags:
      - Settings
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Current authenticated user's Settings, created with defaults on first access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateMySettings
      tags:
      - Settings
      security:
      - CreatorSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: Current authenticated user's Settings after partial update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/users:
    get:
      operationId: listUsers
      tags:
      - Users
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Paginated Users visible to an admin.
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createUser
      tags:
      - Users
      security:
      - CreatorSessionCookie: []
      responses:
        '201':
          description: User created by an admin.
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/users/{id}:
    get:
      operationId: getUser
      tags:
      - Users
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: User detail.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateUser
      tags:
      - Users
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: User updated by an admin.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteUser
      tags:
      - Users
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: User soft-deleted by an admin.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      tags:
      - Workspaces
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Paginated Workspaces visible by Membership.
    post:
      operationId: createWorkspace
      tags:
      - Workspaces
      security:
      - CreatorSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreateRequest'
      responses:
        '201':
          description: Workspace created with an owner Membership for the authenticated Principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/WorkspaceCreateFailed'
  /api/v1/workspaces/{id}:
    get:
      operationId: getWorkspace
      tags:
      - Workspaces
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Workspace detail.
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateWorkspace
      tags:
      - Workspaces
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Workspace updated by admin or owner Membership.
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteWorkspace
      tags:
      - Workspaces
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Workspace soft-deleted by its owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDeleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/WorkspaceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/WorkspaceDeleteFailed'
  /api/v1/brands:
    get:
      operationId: listBrands
      tags:
      - Brands
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Paginated Brands visible by Workspace Membership.
    post:
      operationId: createBrand
      tags:
      - Brands
      security:
      - CreatorSessionCookie: []
      responses:
        '201':
          description: Brand created in a writable Workspace.
        '403':
          $ref: '#/components/responses/WorkspaceAccessDenied'
  /api/v1/brands/{id}:
    get:
      operationId: getBrand
      tags:
      - Brands
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Brand detail.
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateBrand
      tags:
      - Brands
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Brand updated in a writable Workspace.
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteBrand
      tags:
      - Brands
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Brand soft-deleted in a writable Workspace.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/brands/{id}/settings:
    get:
      operationId: getBrandSettings
      tags:
      - Brands
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Brand Settings detail.
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: upsertBrandSettings
      tags:
      - Brands
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Brand Settings upserted.
    patch:
      operationId: updateBrandSettings
      tags:
      - Brands
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Brand Settings updated.
    delete:
      operationId: deleteBrandSettings
      tags:
      - Brands
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Brand Settings soft-deleted.
  /api/v1/campaigns:
    get:
      operationId: listCampaigns
      tags:
      - Campaigns
      security:
      - CreatorSessionCookie: []
      parameters:
      - name: workspace_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paginated Workspace-scoped Campaigns.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCampaign
      tags:
      - Campaigns
      security:
      - CreatorSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
      responses:
        '201':
          description: Campaign created.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/campaigns/{id}:
    get:
      operationId: getCampaign
      tags:
      - Campaigns
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Campaign detail.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCampaign
      tags:
      - Campaigns
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignUpdateRequest'
      responses:
        '200':
          description: Campaign updated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCampaign
      tags:
      - Campaigns
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Campaign soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/personas:
    get:
      operationId: listPersonas
      tags:
      - Personas
      security:
      - CreatorSessionCookie: []
      parameters:
      - name: brand_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paginated brand personas.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Personas
      summary: Create Persona
      operationId: create_persona_api_v1_personas_post
      security:
      - CreatorSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /api/v1/personas/{id}:
    get:
      operationId: getPersona
      tags:
      - Personas
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Persona detail.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePersona
      tags:
      - Personas
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaUpdateRequest'
      responses:
        '200':
          description: Persona updated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deletePersona
      tags:
      - Personas
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Persona soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/planning:
    get:
      operationId: listPlanning
      tags:
      - Planning
      security:
      - CreatorSessionCookie: []
      parameters:
      - name: campaign_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paginated campaign planning records.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Planning
      summary: Create Planning
      operationId: create_planning_api_v1_planning_post
      security:
      - CreatorSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  /api/v1/planning/{id}:
    get:
      operationId: getPlanning
      tags:
      - Planning
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Planning detail.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePlanning
      tags:
      - Planning
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningUpdateRequest'
      responses:
        '200':
          description: Planning updated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deletePlanning
      tags:
      - Planning
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Planning soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/post-structures:
    get:
      operationId: listPostStructures
      tags:
      - Post Structures
      security:
      - CreatorSessionCookie: []
      parameters:
      - name: workspace_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paginated Workspace-scoped Post Structures.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPostStructure
      tags:
      - Post Structures
      security:
      - CreatorSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostStructureCreateRequest'
      responses:
        '201':
          description: Post Structure created.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/post-structures/{id}:
    get:
      operationId: getPostStructure
      tags:
      - Post Structures
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Post Structure detail.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updatePostStructure
      tags:
      - Post Structures
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostStructureUpdateRequest'
      responses:
        '200':
          description: Post Structure updated.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deletePostStructure
      tags:
      - Post Structures
      security:
      - CreatorSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Post Structure soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects:
    get:
      operationId: listProjects
      tags:
      - Projects
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Paginated Projects visible by Workspace Membership.
    post:
      operationId: createProject
      tags:
      - Projects
      security:
      - CreatorSessionCookie: []
      responses:
        '201':
          description: Project created in a writable Workspace.
  /api/v1/projects/{id}:
    get:
      operationId: getProject
      tags:
      - Projects
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Project detail.
    put:
      operationId: updateProject
      tags:
      - Projects
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Project updated.
    delete:
      operationId: deleteProject
      tags:
      - Projects
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Project soft-deleted.
  /api/v1/contents:
    get:
      operationId: listContents
      tags:
      - Contents
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Paginated Content visible by Workspace Membership.
    post:
      operationId: createContent
      tags:
      - Contents
      security:
      - CreatorSessionCookie: []
      parameters:
      - name: planning_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workspace_id
              properties:
                workspace_id:
                  type: string
                  format: uuid
                planning_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                brand_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                project_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                type:
                  type: string
                  enum:
                  - IMAGE
                  - TEXT
                title:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                payload:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Content created in a writable Workspace.
  /api/v1/contents/{id}:
    get:
      operationId: getContentCanonical
      tags:
      - Contents
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Content detail.
    put:
      operationId: updateContent
      tags:
      - Contents
      security:
      - CreatorSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brand_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                project_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                title:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                payload:
                  type:
                  - object
                  - 'null'
                  additionalProperties: true
      responses:
        '200':
          description: Content updated.
    delete:
      operationId: deleteContentCanonical
      tags:
      - Contents
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Content soft-deleted.
  /api/v1/generations:
    get:
      operationId: listGenerations
      tags:
      - Generations
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
          description: Paginated Generations visible by Workspace Membership.
    post:
      operationId: createGeneration
      tags:
      - Generations
      security:
      - CreatorSessionCookie: []
      responses:
        '201':
          description: Generation created in a writable Workspace.
  /api/v1/generations/{id}:
    get:
      operationId: getGeneration
      tags:
      - Generations
      security:
      - CreatorSessionCookie: []
      responses:
        '200':
